[project]
name = "twil-deploy"
version = "0.2.0"
description = "Pinned, authenticated local TwIL deployment with llama.cpp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "huggingface-hub==2.4.0",
    "openai==2.28.0",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
twil-deploy = "twil_deploy.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "RET", "ARG", "S", "T20", "PL", "RUF"]
ignore = ["PLR0913"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"src/twil_deploy/cli.py" = ["T20"]
[tool.mypy]
strict = true
python_version = "3.12"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not smoke'"
markers = ["smoke: browser checks requiring the running local interface"]
